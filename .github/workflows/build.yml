name: Build Android app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # Installable test build (debug-signed). Download it from the run's Artifacts.
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Play Store build. Only runs once you've added the 4 UPLOAD_* secrets + keystore.
      - name: Check for signing secrets
        run: echo "HAS_KEYSTORE=${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" gradle :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
